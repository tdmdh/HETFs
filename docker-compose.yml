services:
  ibgateway:
    image: gnzsnz/ib-gateway:latest
    container_name: ibkr-gateway
    ports:
      - "5000:5000"
      - "4001:4001"
      - "4002:4002"
    environment:
      # These environment variables are required by gnzsnz/ib-gateway to boot IBC
      # They are securely populated from the .env file in the same directory
      - TWS_USERID=${TWS_USERID}
      - TWS_PASSWORD=${TWS_PASSWORD}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - TZ=UTC
    restart: unless-stopped
